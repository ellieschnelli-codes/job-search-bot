name: Job search digest

on:
  schedule:
    # 08:00 Europe/Berlin is 06:00 UTC in summer (CEST) and 07:00 UTC in
    # winter (CET). Both are scheduled; run.js's isWrongDstTrigger() guard
    # makes the one that doesn't match the current DST offset no-op, so
    # only one real run happens per day regardless of season. The guard
    # matches on which cron fired (GITHUB_EVENT_SCHEDULE below), not the
    # wall-clock hour at execution time, since GitHub often runs scheduled
    # workflows late.
    - cron: '0 6 * * 1,3'
    - cron: '0 7 * * 1,3'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed mode — mark all current jobs as seen without judging or emailing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node src/run.js
        env:
          SEED: ${{ inputs.seed }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit updated seen_jobs.json
        # Always attempt this, even if the run.js step above failed (e.g. the
        # email send). run.js now writes seen_jobs.json right after judging,
        # before it tries to send — so a failed send still leaves an updated
        # file on disk here that must get committed, or the next run repeats
        # the same expensive judging for nothing.
        if: always()
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen_jobs.json [skip ci]"
          git push
