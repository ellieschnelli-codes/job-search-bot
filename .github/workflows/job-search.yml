name: Job search digest

on:
  schedule:
    # 08:00 Europe/Berlin is 06:00 UTC in summer (CEST) and 07:00 UTC in
    # winter (CET). Both are scheduled; run.js's isWrongDstTrigger() guard
    # makes the one that doesn't actually land at 8am Berlin time no-op,
    # so only one real run happens per day regardless of season.
    - cron: '0 6 * * 1,3'
    - cron: '0 7 * * 1,3'
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node src/run.js
        env:
          TEST_EMAIL: 'true'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen_jobs.json [skip ci]"
          git push
